# AeroSpace window manager configuration.

config-version = 2

# Keep all named workspaces available even when they have no open windows.
persistent-workspaces = [
    'browser',
    'terminal',
    'editor',
    'ai',
    'slack',
    'media',
    'mail',
    'figma',
    'safari',
    'secondary',
    'macbook',
]

# You can use it to add commands that run after login to a macOS user session.
# `start-at-login` needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# `after-startup-command` is run after 'after-login-command'
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget open -g -b com.brave.Browser',
    'exec-and-forget open -g -b com.google.Chrome',
    'exec-and-forget open -g -b dev.warp.Warp-Stable',
    'exec-and-forget open -g -b com.openai.codex',
    'exec-and-forget open -g -b com.tinyspeck.slackmacgap',
    'exec-and-forget open -g -b com.spotify.client',
    'exec-and-forget open -g -b com.readdle.SparkDesktop',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# Keep tiled windows side by side on every display.
default-root-container-orientation = 'horizontal'

# Keep the pointer in place when focus moves between monitors.
on-focused-monitor-changed = []

# You can effectively turn off the macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.bottom = 12
outer.top = 12
outer.right = 12

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]
# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   Minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         Left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open terminal with alt + enter shortcut
# (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout h_tiles'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-comma = 'layout h_tiles v_accordion'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-leftSquareBracket = 'focus --wrap-around dfs-prev'
alt-rightSquareBracket = 'focus --wrap-around dfs-next'
alt-r = 'focus --wrap-around dfs-next' # One-handed next-window shortcut

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-minus = 'resize smart -100'
alt-equal = 'resize smart +100'
alt-0 = 'balance-sizes'

# Workspace shortcuts. "Hyper" is ctrl + alt + shift + cmd.
ctrl-alt-shift-cmd-w = ['workspace browser', 'exec-and-forget open -g -b com.brave.Browser']
ctrl-alt-shift-cmd-i = 'workspace safari'
ctrl-alt-shift-cmd-4 = ['workspace ai', 'exec-and-forget open -g -b com.openai.codex']
ctrl-alt-shift-cmd-0 = 'workspace figma'
ctrl-alt-shift-cmd-n = ['workspace mail', 'exec-and-forget open -g -b com.apple.Notes']
ctrl-alt-shift-cmd-u = ['workspace media', 'exec-and-forget open -g -b com.apple.podcasts']
ctrl-alt-shift-cmd-s = ['workspace slack', 'exec-and-forget open -g -b com.tinyspeck.slackmacgap']
ctrl-alt-shift-cmd-o = ['workspace media', 'exec-and-forget open -g -b com.sonos.macController2']
ctrl-alt-shift-cmd-m = ['workspace mail', 'exec-and-forget open -g -b com.readdle.SparkDesktop']
ctrl-alt-shift-cmd-d = ['workspace media', 'exec-and-forget open -g -b com.spotify.client']
cmd-backtick = ['workspace terminal', 'exec-and-forget open -g -b dev.warp.Warp-Stable']
ctrl-alt-shift-cmd-e = ['workspace editor', 'exec-and-forget open -g -b dev.zed.Zed']
ctrl-alt-shift-cmd-x = 'workspace secondary'
ctrl-alt-shift-cmd-b = 'workspace macbook'

# Open Downloads in a floating Finder window.
ctrl-alt-shift-cmd-g = 'exec-and-forget /usr/bin/open -a Finder "${HOME}/Downloads"'

# Move the focused window to a workspace and follow it.
# These mnemonics mirror the workspace switching shortcuts above.
alt-shift-w = 'move-node-to-workspace --focus-follows-window browser'
alt-shift-i = 'move-node-to-workspace --focus-follows-window safari'
alt-shift-t = 'move-node-to-workspace --focus-follows-window terminal'
alt-shift-e = 'move-node-to-workspace --focus-follows-window editor'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window ai'
alt-shift-s = 'move-node-to-workspace --focus-follows-window slack'
alt-shift-d = 'move-node-to-workspace --focus-follows-window media'
alt-shift-m = 'move-node-to-workspace --focus-follows-window mail'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window figma'
alt-shift-b = 'move-node-to-workspace --focus-follows-window macbook'

# Move the focused window to the next monitor and follow it.
alt-shift-n = 'move-node-to-monitor --focus-follows-window --wrap-around next'

# Move a window onto the secondary Dell and follow it.
alt-shift-x = 'move-node-to-workspace --focus-follows-window secondary'

# Restore all configured app-to-workspace assignments.
alt-shift-r = 'run-callback --for-every-window on-window-detected'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-shift-cmd-ctrl-tab = 'workspace-back-and-forth'

# See: https://nikitabobko.github.io/AeroSpace/commands#fullscreen
alt-shift-f = 'fullscreen'
alt-shift-g = 'layout floating tiling'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

[workspace-to-monitor-force-assignment]
# The two identical Dells can be renumbered when the main display changes.
# Primary workspaces follow macOS main; monitor 3 is the right-hand display.
browser = 'main'
terminal = 'main'
editor = 'main'
slack = 'main'
media = 'main'
mail = 'main'
ai = 'main'
figma = ['secondary', 3, 'built-in', 'main']
safari = ['secondary', 3, 'built-in', 'main']
secondary = ['secondary', 3, 'built-in', 'main']
macbook = 'built-in'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# Navigate monitors or move the focused window between them.
h = ['focus-monitor left', 'mode main']
l = ['focus-monitor right', 'mode main']
shift-h = ['move-node-to-monitor --focus-follows-window left', 'mode main']
shift-l = ['move-node-to-monitor --focus-follows-window right', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# Browser
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brave.Browser'
run = 'move-node-to-workspace browser'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome'
run = 'move-node-to-workspace browser'

# Safari
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Safari'
run = 'move-node-to-workspace safari'

# Terminal
[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.warp.Warp-Stable'
run = 'move-node-to-workspace terminal'

# Editor
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.jetbrains.WebStorm'
run = 'move-node-to-workspace editor'

[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.zed.Zed'
run = 'move-node-to-workspace editor'

# AI
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.openai.codex'
run = 'move-node-to-workspace ai'

# Slack
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace slack'

# Media
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.spotify.client'
run = 'move-node-to-workspace media'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.sonos.macController2'
run = 'move-node-to-workspace media'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.podcasts'
run = 'move-node-to-workspace media'

# Mail and notes share a vertical accordion workspace.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.readdle.SparkDesktop'
run = 'move-node-to-workspace mail; layout --workspace mail --root v_accordion'

[[on-window-detected]]
if = 'test %{app-bundle-id} = notion.id'
run = 'move-node-to-workspace mail; layout --workspace mail --root v_accordion'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Notes'
run = 'move-node-to-workspace mail; layout --workspace mail --root v_accordion'

# Figma
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.figma.Desktop'
run = 'move-node-to-workspace figma'

# Float these apps
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.raycast.macos'
run = 'layout floating'
