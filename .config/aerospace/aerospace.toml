# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

config-version = 2

# Keep all named workspaces available even when they have no open windows.
persistent-workspaces = [
    'browser',
    'safari',
    'terminal',
    'editor',
    'ai',
    'slack',
    'media',
    'mail',
    'figma',
    'other',
]

# You can use it to add commands that run after login to a macOS user session.
# `start-at-login` needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# `after-startup-command` is run after 'after-login-command'
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 24

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off the macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.bottom = 12
outer.top = 12
outer.right = 12

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]
# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   Minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         Left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open terminal with alt + enter shortcut
# (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal'
alt-comma = 'layout accordion horizontal'
alt-shift-s = 'layout tiles horizontal accordion horizontal'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-minus = 'resize smart -100'
alt-equal = 'resize smart +100'
alt-0 = 'balance-sizes'

# Workspace shortcuts. "Hyper" is ctrl + alt + shift + cmd.
ctrl-alt-shift-cmd-w = 'workspace browser'
ctrl-alt-shift-cmd-i = 'workspace safari'
ctrl-alt-shift-cmd-4 = 'workspace ai'
ctrl-alt-shift-cmd-0 = 'workspace figma'
ctrl-alt-shift-cmd-n = 'workspace other'
ctrl-alt-shift-cmd-u = 'workspace media'
ctrl-alt-shift-cmd-s = 'workspace slack'
ctrl-alt-shift-cmd-o = 'workspace media'
ctrl-alt-shift-cmd-m = 'workspace mail'
ctrl-alt-shift-cmd-d = 'workspace media'
cmd-backtick = 'workspace terminal'
ctrl-alt-shift-cmd-e = 'workspace editor'

# Open a new floating Finder window.
ctrl-alt-shift-cmd-g = '''exec-and-forget osascript -e '
tell application "Finder"
    make new Finder window
    activate
end tell'
'''

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace browser'
alt-shift-2 = 'move-node-to-workspace terminal'
alt-shift-3 = 'move-node-to-workspace editor'
alt-shift-4 = 'move-node-to-workspace slack'
alt-shift-5 = 'move-node-to-workspace media'
alt-shift-6 = 'move-node-to-workspace mail'
alt-shift-7 = 'move-node-to-workspace figma'
alt-shift-8 = 'move-node-to-workspace other'
alt-shift-9 = 'move-node-to-workspace ai'
alt-shift-0 = 'move-node-to-workspace safari'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-shift-cmd-ctrl-tab = 'workspace-back-and-forth'

# See: https://nikitabobko.github.io/AeroSpace/commands#fullscreen
alt-shift-f = 'fullscreen'
alt-shift-g = 'layout floating tiling'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

[workspace-to-monitor-force-assignment]
# The two identical Dells can be renumbered when the main display changes.
# Primary workspaces follow macOS main; monitor 3 is the right-hand display.
browser = 'main'
terminal = 'main'
editor = 'main'
slack = 'main'
media = 'main'
mail = 'main'
other = 'main'
ai = 'main'
figma = ['secondary', 3, 'built-in', 'main']
safari = ['secondary', 3, 'built-in', 'main']

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# Browser
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brave.Browser'
run = 'move-node-to-workspace browser'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome'
run = 'move-node-to-workspace browser'

# Safari
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Safari'
run = 'move-node-to-workspace safari'

# Terminal
[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.warp.Warp-Stable'
run = 'move-node-to-workspace terminal'

# Editor
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.jetbrains.WebStorm'
run = 'move-node-to-workspace editor'

[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.zed.Zed'
run = 'move-node-to-workspace editor'

# AI
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.openai.codex'
run = 'move-node-to-workspace ai'

# Slack
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace slack'

# Media
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.spotify.client'
run = 'move-node-to-workspace media'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.sonos.macController2'
run = 'move-node-to-workspace media'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.podcasts'
run = 'move-node-to-workspace media'

# Mail
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.readdle.SparkDesktop'
run = 'move-node-to-workspace mail'

# Figma
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.figma.Desktop'
run = 'move-node-to-workspace figma'

# Other
[[on-window-detected]]
if = 'test %{app-bundle-id} = notion.id'
run = 'move-node-to-workspace other'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Notes'
run = 'move-node-to-workspace other'

# Float these apps
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.raycast.macos'
run = 'layout floating'
